# Inert build/test fixture. No live backend, account, media or private credentials.
# The upstream bundle regression test requires a configured HTTP(S) backend URL.
NUVIO_SUPABASE_URL=https://identity.example.invalid
NUVIO_SUPABASE_ANON_KEY=fixture-public-anon-key
# QR approval page (a string in the QR only; the browser tests block nuvio.tv).
TV_LOGIN_WEB_BASE_URL=https://nuvio.tv/tv-login

# Static/browser defaults. Enable only for an explicitly configured, reviewed sidecar deployment.
NUVIO_ENABLE_TRAKT_BRIDGE=false
NUVIO_ENABLE_DEBRID_BRIDGE=false
NUVIO_ENABLE_EXTERNAL_RETURN_BRIDGE=false

name: Deploy preview

# Manual only: builds main and uploads it to the nuvioweb-preview Pages project.
# Secrets (set by the owner, never committed):
#   TMDB_API_KEY            public TMDB v3 key baked into the browser bundle
#   TRAKT_CLIENT_ID         optional public Trakt app id; empty leaves Trakt off
#   SIMKL_CLIENT_ID         optional public Simkl app id; empty leaves Simkl off
#   TRAKT_CLIENT_SECRET     optional; stored in the Pages project (never in the bundle)
#                           for the /api/trakt sign-in helper. Trakt sign-in needs it.
#   CLOUDFLARE_API_TOKEN    token limited to Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID   account that owns nuvioweb-preview
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload preview
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          HUSKY=0 npm ci --prefix app/alpha --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Write TMDB key to a private file
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          test -n "$TMDB_API_KEY" || { echo "TMDB_API_KEY secret is not set"; exit 1; }
          umask 077
          printf '%s' "$TMDB_API_KEY" > "$RUNNER_TEMP/tmdb.key"
      - name: Store Trakt client secret in Cloudflare
        id: trakt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          # Trakt only finishes sign-in when the poll carries the client secret,
          # so it lives in the Pages project for functions/api/trakt to add.
          # Without it the page signs in directly and Trakt stays pending.
          if [ -n "$TRAKT_CLIENT_ID" ] && [ -n "$TRAKT_CLIENT_SECRET" ]; then
            printf '%s' "$TRAKT_CLIENT_ID" | npx --yes wrangler@4.151.3 pages secret put TRAKT_CLIENT_ID --project-name nuvioweb-preview
            printf '%s' "$TRAKT_CLIENT_SECRET" | npx --yes wrangler@4.151.3 pages secret put TRAKT_CLIENT_SECRET --project-name nuvioweb-preview
            echo "bridge=true" >> "$GITHUB_OUTPUT"
          else
            echo "bridge=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage preview
        env:
          NUVIO_TMDB_API_KEY_FILE: ${{ runner.temp }}/tmdb.key
          NUVIO_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          NUVIO_SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          NUVIO_TRAKT_BRIDGE: ${{ steps.trakt.outputs.bridge }}
        run: npm run preview:stage
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          commit="$(git rev-parse HEAD)"
          npx --yes wrangler@4.151.3 pages deploy "dist/preview/$commit" \
            --project-name nuvioweb-preview --branch main \
            --commit-hash "$commit" --commit-dirty=false
      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/tmdb.key"

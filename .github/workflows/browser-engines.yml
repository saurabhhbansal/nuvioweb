name: Browser engines (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engines:
    name: Firefox and WebKit playback quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/alpha/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps webkit firefox
      - run: npm ci
        working-directory: app/alpha
      - name: Build inert test application
        run: npm run build
        working-directory: app/alpha
        env:
          NUVIO_LOCAL_PROPERTIES: ${{ github.workspace }}/tests/fixtures/build.properties
      - name: WebKit playback quality
        run: NUVIO_PLAYWRIGHT_WEBKIT=1 npx playwright test --project=webkit
      - name: Firefox playback quality
        run: NUVIO_PLAYWRIGHT_FIREFOX=1 npx playwright test --project=firefox

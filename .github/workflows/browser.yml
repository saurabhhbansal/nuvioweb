name: Browser smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: Chromium application smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/alpha/package-lock.json
      - run: npm ci
      - name: Audit browser verification tooling
        run: npm audit --audit-level=low
      - run: npx playwright install --with-deps chromium
      - run: npm ci
        working-directory: app/alpha
      - name: Build inert test application
        run: npm run build
        working-directory: app/alpha
        env:
          NUVIO_LOCAL_PROPERTIES: ${{ github.workspace }}/tests/fixtures/build.properties
      - run: npm run test:browser
      - run: npm run test:addon-fixtures
      - run: npm run test:preview
      - name: Rebuild and stage public-only static preview without uploading
        run: npm run preview:stage

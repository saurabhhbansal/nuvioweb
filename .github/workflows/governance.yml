name: Roadmap integrity
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Roadmap and import checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: node --test scripts/governance.test.mjs
      - run: node scripts/check-progress.mjs
      # Issue #7's evidence gate uses only the existing read-only contents scope.
      # The schema/honesty mode is expected to pass while the parent is blocked;
      # the full closure command remains a release/closure step and exits 2 until
      # every mapped criterion is genuinely met.
      - name: Issue #7 acceptance gate tests and receipt validation
        run: |
          node --test scripts/check-issue7-acceptance.test.mjs
          node scripts/check-issue7-acceptance.mjs docs/evidence/issue7-acceptance.json --validate
      - name: Check every new ancestry commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-commit-references.mjs "$BASE_SHA" "$HEAD_SHA"

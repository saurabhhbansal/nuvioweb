name: Root script checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    # Job name is a required status check on main; keep it unchanged.
    name: Roadmap and import checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Root script unit tests (no install needed)
        run: node --test scripts/stage-legal-demo.test.mjs scripts/quality-fixture-packaging.test.mjs

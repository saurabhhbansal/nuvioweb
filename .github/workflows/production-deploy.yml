name: Deploy production

# Manual only: builds one release tag and uploads it to the nuvioweb Pages project.
# See docs/DEPLOY_PRODUCTION.md. Secrets (set by the owner, never committed):
#   TMDB_API_KEY            public TMDB v3 key baked into the browser bundle
#   CLOUDFLARE_API_TOKEN    token limited to Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID   account that owns the nuvioweb project
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag on main to deploy, for example v0.1 or v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check the release tag name
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$RELEASE_TAG' is not a release tag like v0.1 or v0.1.0"
            exit 1
          fi
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Check the tag exists and is on main
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tagged="$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}")" || {
            echo "::error::Tag $RELEASE_TAG does not exist"; exit 1; }
          test "$tagged" = "$(git rev-parse HEAD)" || { echo "::error::Checkout does not match $RELEASE_TAG"; exit 1; }
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$tagged" --jq .status)"
          case "$status" in
            identical|behind) echo "Deploying $RELEASE_TAG at $tagged" ;;
            *) echo "::error::Tag $RELEASE_TAG is not on main ($status)"; exit 1 ;;
          esac
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          HUSKY=0 npm ci --prefix app/alpha --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Write TMDB key to a private file
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          test -n "$TMDB_API_KEY" || { echo "TMDB_API_KEY secret is not set"; exit 1; }
          umask 077
          printf '%s' "$TMDB_API_KEY" > "$RUNNER_TEMP/tmdb.key"
      - name: Stage release
        env:
          NUVIO_TMDB_API_KEY_FILE: ${{ runner.temp }}/tmdb.key
        run: npm run preview:stage
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          commit="$(git rev-parse HEAD)"
          npx --yes wrangler@4.151.3 pages deploy "dist/preview/$commit" \
            --project-name nuvioweb --branch main \
            --commit-hash "$commit" --commit-message "Release $RELEASE_TAG" --commit-dirty=false
      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/tmdb.key"
